<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Application Portal</title>
  <link href="https://db.onlinewebfonts.com/c/4cae543bca37f9c0d67178805b31cbb1?family=Plain-Ultralight" rel="stylesheet">
  <style>
    
    body {
      font-family: "Plain-Ultralight", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
      padding-top: 20px;
    }
    
    .logo {
      height: 80px;
      width: auto;
      object-fit: contain;
      max-width: 250px;
    }

    .site-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #333;
      margin: 12px 0 4px;
    }

    .tagline {
      font-size: 14px;
      color: #64748b;
      font-weight: 400;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto 50px;
      background: white;
      padding: 40px;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    
    h2 {
      color: #333;
      margin-top: 0;
      font-size: 28px;
    }
    
    h3 {
      color: #555;
      margin-top: 30px;
      font-size: 18px;
    }
    
    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: #FF7F50;
      color: white;
      border: none;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #ff6a3d;
    }
    
    input {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    input:focus {
      outline: none;
      border-color: #FF7F50;
    }
    
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 30px 0;
    }
    
    #error {
      color: #d32f2f;
      margin-top: 15px;
    }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #FF7F50;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      font-size: 16px;
      color: #333;
    }
  </style>

  <script type="text/javascript" src="constants.js?v=2"></script>
</head>
<body>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <div class="logo-container">
    <img src="media/Logo.png" alt="Application Portal Logo" class="logo">
    <h1 class="site-title">AI for Math Fund</h1>
    <h3>Application Submission</h3>
  </div>

  <div class="container" id="surveyContainer">
    <!-- <h2>Application Portal</h2> -->

    <!-- New Application -->
    <button id="startNewBtn" onclick="startNewApplication()" style="display:none;">
      Start New Application
    </button>
    <div id="formStatusMessage" style="margin-top:12px;color:#6b7280;"></div>

    <hr />

    <!-- Resume Application -->
    <h3>Resume Existing Application</h3>
    <input
      type="text"
      id="applicationIdInput"
      placeholder="Enter Application ID"
    />
    <button onclick="resumeApplication()">
      Resume
    </button>

    <p id="error"></p>
  </div>

  <p style="text-align:center; font-size:12px; color:#888; margin-top:12px;">
    We recommend using Google Chrome to complete this form
  </p>

  <script>

    // ─── Check form status on load: hide Start button if disabled ─
    document.addEventListener('DOMContentLoaded', function() {
      // ─── Auto-resume if ?applicationId= is present in the URL ──
      const params = new URLSearchParams(window.location.search);
      const urlApplicationId = params.get("applicationId");
      if (urlApplicationId) {
        // Keep the loading overlay visible — user never sees the landing page
        document.getElementById("applicationIdInput").value = urlApplicationId;
        resumeApplication();
        return; // skip form-status fetch; resumeApplication handles its own errors
      }

      // No auto-resume — hide the overlay and show the landing page normally
      document.getElementById("loadingOverlay").style.display = "none";

      checkFormStatus();
    });

    // Handle back button / page restoration from cache
    window.addEventListener('pageshow', function(event) {
      document.getElementById("loadingOverlay").style.display = "none";
      if (event.persisted) {
        document.getElementById("error").textContent = "";
        document.getElementById("applicationIdInput").value = "";
      }
    });

    async function startNewApplication() {
      try {
        sessionStorage.clear();

        document.getElementById("loadingOverlay").style.display = "flex";

        const response = await fetch(`${API_BASE}/create`, {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        // Handle form disabled (403 Forbidden)
        if (response.status === 403) {
          const data = await response.json();
          document.getElementById("loadingOverlay").style.display = "none";
          document.getElementById("startNewBtn").style.display = "none";
          const msgEl = document.getElementById("formStatusMessage");
          if (msgEl) {
            msgEl.innerHTML = '<strong>Form Currently Unavailable</strong>'
              + (data.message ? `<div style="margin-top:6px;color:#6b7280;">${data.message}</div>` : '')
              + (data.reason || data.details ? `<div style="margin-top:6px;color:#6b7280;">Reason: ${data.reason || data.details}</div>` : '');
          }
          return;
        }

        // Handle rate limit error (server is busy)
        if (response.status === 429) {
          throw new Error("The server is busy at this time. Please try again in 1 minute.");
        }

        if (!response.ok) throw new Error("Failed to create application");

        const data = await response.json();

        sessionStorage.setItem("surveySchema", JSON.stringify(data.schema));
        if (data.applicationId) {
          sessionStorage.setItem("applicationId", data.applicationId);
        } else {
          sessionStorage.removeItem("applicationId");
        }

        window.location.href = "/survey.html";

      } catch (err) {
        document.getElementById("loadingOverlay").style.display = "none";
        document.getElementById("error").textContent = err.message;
      }
    }

    async function resumeApplication() {
      const applicationId = document.getElementById("applicationIdInput").value.trim();
      if (!applicationId) return;

      try {
        document.getElementById("loadingOverlay").style.display = "flex";

        const response = await fetch(`${API_BASE}/${applicationId}`);

        // Handle form disabled (403 Forbidden)
        if (response.status === 403) {
          const data = await response.json();
          document.getElementById("loadingOverlay").style.display = "none";
          document.getElementById("error").textContent = data.message || "This form is currently disabled.";
          return;
        }

        // Handle rate limit error (server is busy)
        if (response.status === 429) {
          throw new Error("The server is busy at this time. Please try again in 1 minute.");
        }

        if (!response.ok) throw new Error("Application not found");

        const data = await response.json();

        sessionStorage.setItem("surveySchema", JSON.stringify(data.schema));
        sessionStorage.setItem("surveyAnswers", JSON.stringify(data.answers));
        sessionStorage.setItem("applicationId", applicationId);
        sessionStorage.setItem("applicationState", JSON.stringify(data.state));
        sessionStorage.setItem("isReadOnly", data.isReadOnly);
        // formDisabled is already set/cleared by the on-load form-status check

        window.location.href = "/survey.html";

      } catch (err) {
        document.getElementById("loadingOverlay").style.display = "none";
        document.getElementById("error").textContent = err.message;
        // Fetch form-status to show "Start New Application" button if available
        checkFormStatus();
      }
    }

    // Helper function to check form status and show/hide Start button
    function checkFormStatus() {
      fetch(`${API_BASE}/form-status`)
        .then(async res => {
          const data = await res.json().catch(() => ({}));
          const disabled = res.status === 403 || data.enabled === false;
          if (disabled) {
            sessionStorage.setItem("formDisabled", "true");
            const startBtn = document.getElementById("startNewBtn");
            if (startBtn) startBtn.style.display = "none";
            const msgEl = document.getElementById("formStatusMessage");
            if (msgEl) {
              msgEl.innerHTML = "<strong>Form Currently Unavailable</strong>"
                + (data.message ? `<div style="margin-top:6px;color:#6b7280;">${data.message}</div>` : "")
                + (data.reason  ? `<div style="margin-top:6px;color:#6b7280;">Reason: ${data.reason}</div>` : "");
            }
          } else {
            sessionStorage.removeItem("formDisabled");
            const startBtn = document.getElementById("startNewBtn");
            if (startBtn) startBtn.style.display = "";
          }
        })
        .catch(() => { 
          /* network error – keep page fully usable */ 
          sessionStorage.removeItem("formDisabled");
          const startBtn = document.getElementById("startNewBtn");
          if (startBtn) startBtn.style.display = "";
        });
    }
  </script>

</body>
</html>
